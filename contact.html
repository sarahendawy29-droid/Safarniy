    <title>Contact</title>
</head>
<body>
  <!--header-nav-->  
<header>
<nav class="navbar">

<i class="fa-solid fa-earth-americas"></i>GlobeTrek

</header>
<!--hero section-->
<section class="hero-section">
  <div class="hero-overlay">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you!</p>
  </div>
</section>

<!-- (Form + Map) -->
<section class="main-contact-container">
    <!-- Left Column: Form -->
    <div class="contact-form-container">
        <h2>Send Us a Message</h2>
        <form action="#">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Enter subject">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="Your message..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <!-- Social Links -->
    <div class="contact-map-container">
        <div class="map-box">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d110502.60389543888!2d31.18842347101562!3d30.05948381864115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fa60b21beeb%3A0x79dfb296e8423bba!2sCairo%2C%20Cairo%20Governorate!5e0!3m2!1sen!2seg!4v1700000000000!5m2!1sen!2seg" 
                width="100%" 
                height="320" 
                style="border:0; border-radius: 8px;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <div class="social-links-section">
            <h3>Follow Us</h3>
            <div class="social-icons">
                <a href="#" class="icon facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icon instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="icon twitter"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="icon youtube"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="icon linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
        </div>
    </div>
</section>

<!-- Footer Section -->
<footer class="footer-section">
    <div class="footer-content">
        <div class="footer-logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>GlobeTrek</span>

        <div class="footer-links">

            <a href="#">Contact</a>
        </div>

        <div class="footer-social">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2025 GlobeTrek. All rights reserved.</p>
    </div>
</footer>
